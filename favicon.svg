<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="15" fill="#111111" />
  
  <!-- Glow effect -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
  
  <!-- Letter A with circuit board styling -->
  <g filter="url(#glow)">
    <!-- Main A shape -->
    <path d="M50,15 L20,85 L35,85 L40,70 L60,70 L65,85 L80,85 L50,15 Z" fill="none" stroke="#00ff8c" stroke-width="2" />
    
    <!-- Crossbar of A -->
    <line x1="35" y1="55" x2="65" y2="55" stroke="#00ff8c" stroke-width="2" />
    
    <!-- Circuit elements -->
    <circle cx="50" cy="30" r="3" fill="#00ff8c" />
    <circle cx="35" cy="55" r="3" fill="#00ff8c" />
    <circle cx="65" cy="55" r="3" fill="#00ff8c" />
    <circle cx="40" cy="70" r="3" fill="#00ff8c" />
    <circle cx="60" cy="70" r="3" fill="#00ff8c" />
    
    <!-- Circuit lines -->
    <line x1="50" y1="30" x2="35" y2="55" stroke="#00ff8c" stroke-width="1" />
    <line x1="50" y1="30" x2="65" y2="55" stroke="#00ff8c" stroke-width="1" />
    <line x1="35" y1="55" x2="40" y2="70" stroke="#00ff8c" stroke-width="1" />
    <line x1="65" y1="55" x2="60" y2="70" stroke="#00ff8c" stroke-width="1" />
  </g>
  
  <!-- Small dot pattern for tech feel -->
  <g fill="#00ff8c" opacity="0.5">
    <circle cx="15" cy="15" r="1" />
    <circle cx="25" cy="15" r="1" />
    <circle cx="35" cy="15" r="1" />
    <circle cx="15" cy="25" r="1" />
    <circle cx="15" cy="35" r="1" />
    
    <circle cx="85" cy="15" r="1" />
    <circle cx="75" cy="15" r="1" />
    <circle cx="65" cy="15" r="1" />
    <circle cx="85" cy="25" r="1" />
    <circle cx="85" cy="35" r="1" />
    
    <circle cx="15" cy="85" r="1" />
    <circle cx="25" cy="85" r="1" />
    <circle cx="35" cy="85" r="1" />
    <circle cx="15" cy="75" r="1" />
    <circle cx="15" cy="65" r="1" />
    
    <circle cx="85" cy="85" r="1" />
    <circle cx="75" cy="85" r="1" />
    <circle cx="65" cy="85" r="1" />
    <circle cx="85" cy="75" r="1" />
    <circle cx="85" cy="65" r="1" />
  </g>
</svg>