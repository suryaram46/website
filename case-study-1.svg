<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#111111" />
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff8c;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grad)" />
  
  <!-- Grid lines -->
  <g stroke="#00ff8c" stroke-width="1" opacity="0.2">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>
  
  <!-- Chart -->
  <g transform="translate(100, 350)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-250" stroke="#ffffff" stroke-width="2" />
    
    <!-- Before AI Line -->
    <polyline points="0,0 100,-50 200,-70 300,-90 400,-100 500,-110" 
              fill="none" stroke="#ff5555" stroke-width="3" />
    
    <!-- After AI Line -->
    <polyline points="0,0 100,-80 200,-130 300,-180 400,-220 500,-250" 
              fill="none" stroke="#00ff8c" stroke-width="3" />
    
    <!-- Data Points Before -->
    <circle cx="0" cy="0" r="5" fill="#ff5555" />
    <circle cx="100" cy="-50" r="5" fill="#ff5555" />
    <circle cx="200" cy="-70" r="5" fill="#ff5555" />
    <circle cx="300" cy="-90" r="5" fill="#ff5555" />
    <circle cx="400" cy="-100" r="5" fill="#ff5555" />
    <circle cx="500" cy="-110" r="5" fill="#ff5555" />
    
    <!-- Data Points After -->
    <circle cx="0" cy="0" r="5" fill="#00ff8c" />
    <circle cx="100" cy="-80" r="5" fill="#00ff8c" />
    <circle cx="200" cy="-130" r="5" fill="#00ff8c" />
    <circle cx="300" cy="-180" r="5" fill="#00ff8c" />
    <circle cx="400" cy="-220" r="5" fill="#00ff8c" />
    <circle cx="500" cy="-250" r="5" fill="#00ff8c" />
    
    <!-- Labels -->
    <text x="600" y="15" fill="#ffffff" font-family="Arial" font-size="14">TIME</text>
    <text x="-40" y="-250" fill="#ffffff" font-family="Arial" font-size="14">CAC</text>
    
    <!-- Legend -->
    <g transform="translate(400, -280)">
      <rect x="0" y="0" width="180" height="50" fill="rgba(0,0,0,0.7)" rx="5" />
      <line x1="10" y1="15" x2="40" y2="15" stroke="#ff5555" stroke-width="3" />
      <text x="50" y="20" fill="#ffffff" font-family="Arial" font-size="12">Before AI</text>
      <line x1="10" y1="35" x2="40" y2="35" stroke="#00ff8c" stroke-width="3" />
      <text x="50" y="40" fill="#ffffff" font-family="Arial" font-size="12">After AI</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" fill="#ffffff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">
    D2C Brand CAC Reduction Case Study
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="80" fill="#00ff8c" font-family="Arial" font-size="18" text-anchor="middle">
    47% Lower Customer Acquisition Cost
  </text>
  
  <!-- AI Icon -->
  <g transform="translate(700, 80)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00ff8c" stroke-width="2" />
    <text x="0" y="5" fill="#00ff8c" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">AI</text>
  </g>
</svg>