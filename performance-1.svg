<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#111111" />
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff8c;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grad)" />
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" />
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff8c" stroke-width="0.5" opacity="0.2" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Central Cookie Icon with Slash -->
  <g transform="translate(400, 250)">
    <!-- Cookie -->
    <circle cx="0" cy="0" r="80" fill="#333" stroke="#00ff8c" stroke-width="2" />
    <circle cx="-40" cy="-30" r="10" fill="#555" />
    <circle cx="20" cy="-40" r="8" fill="#555" />
    <circle cx="40" cy="10" r="12" fill="#555" />
    <circle cx="-20" cy="30" r="9" fill="#555" />
    <circle cx="0" cy="-10" r="7" fill="#555" />
    
    <!-- Slash -->
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#ff5555" stroke-width="8" />
    <line x1="-56" y1="-60" x2="64" y2="60" stroke="#ff5555" stroke-width="8" />
  </g>
  
  <!-- Data Flow Visualization -->
  <!-- User -->
  <g transform="translate(150, 250)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00ff8c" stroke-width="2" />
    <circle cx="0" cy="-15" r="15" fill="none" stroke="#00ff8c" stroke-width="2" />
    <path d="M-20,15 C-20,40 20,40 20,15" fill="none" stroke="#00ff8c" stroke-width="2" />
    <text x="0" y="70" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">User</text>
  </g>
  
  <!-- Website -->
  <g transform="translate(400, 120)">
    <rect x="-50" y="-30" width="100" height="60" rx="5" fill="none" stroke="#00ff8c" stroke-width="2" />
    <line x1="-40" y1="-15" x2="40" y2="-15" stroke="#00ff8c" stroke-width="2" />
    <line x1="-40" y1="0" x2="20" y2="0" stroke="#00ff8c" stroke-width="2" />
    <line x1="-40" y1="15" x2="30" y2="15" stroke="#00ff8c" stroke-width="2" />
    <text x="0" y="50" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Website</text>
  </g>
  
  <!-- AI Attribution -->
  <g transform="translate(650, 250)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="none" stroke="#00ff8c" stroke-width="2" />
    <text x="0" y="0" fill="#00ff8c" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">AI</text>
    <text x="0" y="20" fill="#00ff8c" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Attribution</text>
    <text x="0" y="70" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Model</text>
  </g>
  
  <!-- Data Warehouse -->
  <g transform="translate(400, 380)">
    <path d="M-60,-20 L60,-20 L60,20 L-60,20 Z" fill="none" stroke="#00ff8c" stroke-width="2" />
    <path d="M-60,-20 C-60,-35 60,-35 60,-20" fill="none" stroke="#00ff8c" stroke-width="2" />
    <path d="M-60,0 C-60,-15 60,-15 60,0" fill="none" stroke="#00ff8c" stroke-width="2" />
    <text x="0" y="50" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">Data Warehouse</text>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#00ff8c" stroke-width="2" stroke-dasharray="5,5">
    <!-- User to Website -->
    <path d="M190,230 C250,150 350,150 400,120" fill="none" />
    
    <!-- User to AI Attribution -->
    <path d="M190,250 C300,250 500,250 590,250" fill="none" />
    
    <!-- Website to Data Warehouse -->
    <path d="M400,150 C400,200 400,300 400,360" fill="none" />
    
    <!-- AI Attribution to Data Warehouse -->
    <path d="M650,290 C650,350 500,380 460,380" fill="none" />
  </g>
  
  <!-- First-Party Data Icons -->
  <g transform="translate(300, 200)">
    <circle cx="0" cy="0" r="20" fill="#333" stroke="#00ff8c" stroke-width="1.5" />
    <text x="0" y="5" fill="#00ff8c" font-family="Arial" font-size="18" text-anchor="middle">1P</text>
  </g>
  
  <g transform="translate(500, 300)">
    <circle cx="0" cy="0" r="20" fill="#333" stroke="#00ff8c" stroke-width="1.5" />
    <text x="0" y="5" fill="#00ff8c" font-family="Arial" font-size="18" text-anchor="middle">1P</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" fill="#ffffff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">
    The Future of Attribution in a Cookieless World
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="80" fill="#00ff8c" font-family="Arial" font-size="16" text-anchor="middle">
    AI-Powered Solutions for Modern Marketing
  </text>
</svg>